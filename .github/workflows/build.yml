name: Build & Sign Cosmopedia for Google Play

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android Project
        run: |
          npm install
          npx cap init "Cosmopedia" "com.damu7341.cosmopedia" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Generate Release AAB & APK
        working-directory: android
        run: 
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug

      - name: Sign Release AAB for Google Play
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Play Store Bundle & Test APK
        uses: actions/upload-artifact@v4
        with:
          name: cosmopedia-playstore-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/app-debug.apk
