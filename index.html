<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmopedia — Universal Spacecraft Encyclopedia</title>
  <style>
    :root {
      --bg-deep: #04060e;
      --bg-card: rgba(13, 18, 36, 0.88);
      --bg-infobox: rgba(18, 25, 50, 0.96);
      --border: rgba(116, 143, 252, 0.26);
      --text-main: #e8ecf8;
      --text-muted: #9aa5ce;
      --accent: #6ea8fe;
      --accent-glow: rgba(110, 168, 254, 0.32);
      --badge-bg: rgba(110, 168, 254, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      line-height: 1.72;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #space-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: radial-gradient(ellipse at bottom, #101835 0%, #04060e 82%);
    }

    .nebula-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 22%, rgba(92, 58, 186, 0.18), transparent 46%),
        radial-gradient(circle at 82% 74%, rgba(26, 114, 192, 0.16), transparent 52%);
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(4, 6, 14, 0.85);
      backdrop-filter: blur(14px);
      padding: 1rem 1.35rem;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      align-items: center;
      justify-content: space-between;
    }

    .brand { cursor: pointer; }
    .brand h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.65rem;
      color: #fff;
      text-shadow: 0 0 18px var(--accent-glow);
    }
    .brand p { font-size: 0.8rem; color: var(--text-muted); }

    .search-box {
      display: flex;
      gap: 0.5rem;
      flex: 1;
      max-width: 500px;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.62rem 0.95rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(9, 13, 26, 0.96);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    button {
      padding: 0.56rem 0.95rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--badge-bg);
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    button:hover {
      background: rgba(110, 168, 254, 0.28);
      color: #fff;
    }

    main {
      max-width: 1120px;
      margin: 1.6rem auto;
      padding: 0 1.25rem 4rem;
    }

    .category-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.4rem;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #04060e;
      border-color: var(--accent);
    }

    .stats-banner {
      background: rgba(18, 25, 50, 0.72);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(295px, 1fr));
      gap: 1.15rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .card-thumb {
      width: 100%;
      height: 155px;
      object-fit: cover;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 12, 24, 0.9);
    }

    .card-body {
      padding: 1.15rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h2 {
      font-family: Georgia, serif;
      font-size: 1.22rem;
      margin-bottom: 0.35rem;
      color: #fff;
    }

    .tag {
      display: inline-block;
      font-size: 0.74rem;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      background: var(--badge-bg);
      border: 1px solid var(--border);
      color: var(--accent);
      margin-bottom: 0.55rem;
    }

    /* Full Wikipedia-Style Article */
    .article {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.85rem;
      backdrop-filter: blur(10px);
    }

    .article-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.85rem;
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .article-header h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.05rem;
      font-weight: normal;
      margin-top: 0.5rem;
    }

    .toc {
      background: rgba(9, 13, 26, 0.82);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.95rem 1.25rem;
      margin: 1rem 0 1.5rem;
      display: inline-block;
      min-width: 260px;
      max-width: 100%;
    }

    .toc-title {
      font-weight: bold;
      font-size: 0.92rem;
      margin-bottom: 0.45rem;
      color: #fff;
    }

    .toc ul { list-style: none; font-size: 0.86rem; }
    .toc li { margin: 0.26rem 0; }
    .toc a { color: var(--accent); text-decoration: none; }
    .toc a:hover { text-decoration: underline; }

    .infobox {
      float: right;
      width: 325px;
      margin: 0 0 1.25rem 1.5rem;
      background: var(--bg-infobox);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      overflow: hidden;
    }

    .infobox-title {
      background: rgba(110, 168, 254, 0.24);
      padding: 0.65rem;
      text-align: center;
      font-weight: bold;
      font-size: 1.02rem;
      border-bottom: 1px solid var(--border);
    }

    .infobox img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--border);
    }

    .infobox table { width: 100%; border-collapse: collapse; }
    .infobox th, .infobox td {
      padding: 0.5rem 0.65rem;
      border-bottom: 1px solid rgba(116, 143, 252, 0.14);
      text-align: left;
      vertical-align: top;
    }
    .infobox th { width: 42%; color: var(--text-muted); font-weight: 600; }

    .article h2 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 1.45rem;
      border-bottom: 1px solid var(--border);
      margin: 1.85rem 0 0.75rem;
      padding-bottom: 0.25rem;
      color: #fff;
    }

    .article h3 {
      font-family: Georgia, serif;
      font-size: 1.15rem;
      margin: 1.25rem 0 0.5rem;
      color: var(--accent);
    }

    .article p { margin-bottom: 0.95rem; color: #dce2f7; }

    .loader {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--accent);
      font-size: 1.05rem;
    }

    @media (max-width: 740px) {
      .infobox { float: none; width: 100%; margin: 0 0 1.25rem 0; }
    }
  </style>
</head>
<body>
  <canvas id="space-canvas"></canvas>
  <div class="nebula-overlay"></div>

  <header>
    <div class="header-inner">
      <div class="brand" onclick="loadCategory(currentCategory)">
        <h1>Cosmopedia</h1>
        <p>Universal Spacecraft & Spaceflight Encyclopedia</p>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search any spacecraft, probe, rover, or rocket..." />
        <button id="searchBtn">Search</button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <script>
    // 1. Deep Space Starfield Animation
    const canvas = document.getElementById("space-canvas");
    const ctx = canvas.getContext("2d");
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = Array.from({ length: 210 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.7 + 0.3,
        speed: Math.random() * 0.14 + 0.03
      }));
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of stars) {
        s.y -= s.speed;
        if (s.y < 0) s.y = canvas.height;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 232, 255, ${0.4 + Math.sin(Date.now() * 0.002 + s.x) * 0.35})`;
        ctx.fill();
      }
      requestAnimationFrame(animateStars);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    animateStars();

    // 2. Spaceflight Categories (Pulls live batches of real spacecraft from Wikipedia)
    const CATEGORIES = [
      { label: "Iconic Spacecraft", query: "notable space probes rovers telescopes" },
      { label: "Moon Missions", query: "lunar lander orbiter rover spacecraft mission" },
      { label: "Mars Missions", query: "Mars rover lander orbiter spacecraft" },
      { label: "Outer Planets & Deep Space", query: "Voyager Cassini Galileo Juno New Horizons probe" },
      { label: "Space Telescopes", query: "space telescope observatory satellite" },
      { label: "Space Stations & Crew", query: "space station crewed spacecraft capsule" },
      { label: "ISRO Missions", query: "ISRO spacecraft satellite Chandrayaan Mangalyaan Aditya" },
      { label: "Solar & Near-Earth Probes", query: "solar probe heliosphere magnetosphere spacecraft" }
    ];

    let currentCategory = CATEGORIES[0];
    let favorites = JSON.parse(localStorage.getItem("cosmopedia_favs_v2") || "[]");
    const app = document.getElementById("app");
    const searchInput = document.getElementById("searchInput");

    function toggleFav(title) {
      favorites = favorites.includes(title)
        ? favorites.filter(f => f !== title)
        : [...favorites, title];
      localStorage.setItem("cosmopedia_favs_v2", JSON.stringify(favorites));
      openSpacecraftArticle(title);
    }

    // 3. Load a Catalog Grid of Real Spacecraft from Wikipedia API
    async function loadCategory(catOrQuery, isCustomSearch = false) {
      if (!isCustomSearch) currentCategory = catOrQuery;
      const searchTerm = isCustomSearch ? catOrQuery : catOrQuery.query;

      app.innerHTML = `<div class="loader">Scanning deep-space archives for "${isCustomSearch ? catOrQuery : catOrQuery.label}"...</div>`;

      try {
        // Fetch up to 24 matching spacecraft articles with thumbnails and extracts
        const url = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(searchTerm)}&gsrlimit=24&prop=pageimages|extracts|description&exintro=1&explaintext=1&exsentences=2&pithumbsize=420&format=json&origin=*`;
        const res = await fetch(url);
        const data = await res.json();
        const pages = Object.values(data?.query?.pages || {}).sort((a, b) => a.index - b.index);

        renderCatalog(pages, isCustomSearch ? `Search results for "${catOrQuery}"` : catOrQuery.label);
      } catch (err) {
        app.innerHTML = `<div class="article"><p>Unable to reach Wikipedia spaceflight archives. Check your internet connection and try again.</p></div>`;
      }
    }

    function renderCatalog(pages, headingLabel) {
      app.innerHTML = `
        <div class="category-bar">
          ${CATEGORIES.map((c, idx) => `
            <button class="cat-btn ${currentCategory.label === c.label ? "active" : ""}" onclick="loadCategory(CATEGORIES[${idx}])">
              ${c.label}
            </button>
          `).join("")}
          <button class="cat-btn" onclick="showFavorites()">★ Saved (${favorites.length})</button>
        </div>

        <div class="stats-banner">
          <span>Showing <strong>${pages.length}</strong> spacecraft records in <strong>${headingLabel}</strong></span>
          <span>Live Encyclopedia Mode • Search any spacecraft ever launched</span>
        </div>

        <div class="grid">
          ${pages.map(p => `
            <div class="card" onclick="openSpacecraftArticle('${p.title.replace(/'/g, "\\'")}')">
              ${p.thumbnail ? `<img class="card-thumb" src="${p.thumbnail.source}" alt="${p.title}" loading="lazy" />` : ""}
              <div class="card-body">
                <div>
                  <h2>${p.title}</h2>
                  ${p.description ? `<span class="tag">${p.description}</span>` : ""}
                  <p style="font-size:0.88rem;color:#c5ceec;">${p.extract || "Tap to open full technical specifications and mission history."}</p>
                </div>
                <div style="margin-top:0.85rem;font-size:0.82rem;color:var(--accent);">Read full Wikipedia entry →</div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function showFavorites() {
      if (favorites.length === 0) {
        app.innerHTML = `
          <div class="article">
            <button onclick="loadCategory(currentCategory)">← Back to Spacecraft Catalog</button>
            <h2>No Saved Spacecraft Yet</h2>
            <p>Open any spacecraft entry and tap <strong>☆ Save</strong> to bookmark it here.</p>
          </div>
        `;
        return;
      }
      app.innerHTML = `
        <div class="article">
          <button onclick="loadCategory(currentCategory)" style="margin-bottom:1rem;">← Back to Spacecraft Catalog</button>
          <h2>★ Saved Spacecraft (${favorites.length})</h2>
          <div class="grid" style="margin-top:1rem;">
            ${favorites.map(title => `
              <div class="card" onclick="openSpacecraftArticle('${title.replace(/'/g, "\\'")}')">
                <div class="card-body">
                  <h2>${title}</h2>
                  <div style="font-size:0.82rem;color:var(--accent);">Open full encyclopedia entry →</div>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    // 4. Open Full Unabridged Wikipedia Article + Wikidata Telemetry Infobox
    async function openSpacecraftArticle(title) {
      app.innerHTML = `<div class="loader">Downloading complete mission dossier & telemetry for <strong>${title}</strong>...</div>`;
      window.scrollTo({ top: 0, behavior: "smooth" });

      try {
        // Fetch full unabridged plain-text article, image, description, and Wikidata Q-ID
        const wikiUrl = `https://en.wikipedia.org/w/api.php?action=query&prop=extracts|pageimages|description|info|pageprops&inprop=url&explaintext=1&pithumbsize=600&titles=${encodeURIComponent(title)}&format=json&origin=*`;
        const res = await fetch(wikiUrl);
        const data = await res.json();
        const page = Object.values(data?.query?.pages || {})[0];

        if (!page || !page.extract) {
          app.innerHTML = `<div class="article"><button onclick="loadCategory(currentCategory)">← Back</button><h2>Article unavailable</h2></div>`;
          return;
        }

        // Parse ALL sections and subsections from the Wikipedia article
        const rawText = page.extract;
        const parts = rawText.split(/\n(={2,3})\s*([^=]+?)\s*\1\n/);
        const leadParagraphs = parts[0].split("\n").filter(p => p.trim().length > 0);
        const sections = [];

        for (let i = 1; i < parts.length; i += 3) {
          const level = parts[i].length; // 2 = h2, 3 = h3
          const secTitle = parts[i + 1].trim();
          const body = (parts[i + 2] || "").split("\n").filter(p => p.trim().length > 0);
          if (!["See also", "References", "External links", "Further reading", "Notes"].includes(secTitle)) {
            sections.push({ level, title: secTitle, body });
          }
        }

        const isFav = favorites.includes(page.title);

        app.innerHTML = `
          <article class="article">
            <div class="article-header">
              <div>
                <button onclick="loadCategory(currentCategory)">← Back to Encyclopedia</button>
                <h1>${page.title}</h1>
              </div>
              <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                <button onclick="toggleFav('${page.title.replace(/'/g, "\\'")}')">${isFav ? "★ Saved" : "☆ Save"}</button>
                <a href="${page.fullurl || '#'}" target="_blank" rel="noopener">
                  <button>Wikipedia Source ↗</button>
                </a>
              </div>
            </div>

            <aside class="infobox">
              <div class="infobox-title">${page.title}</div>
              ${page.thumbnail ? `<img src="${page.thumbnail.source}" alt="${page.title}" />` : ""}
              <table>
                <tr><th>Classification</th><td>${page.description || "Spacecraft / Spaceflight Mission"}</td></tr>
                <tr><th>Article Depth</th><td>${sections.filter(s => s.level === 2).length} Major Sections (${rawText.split(/\s+/).length.toLocaleString()} words)</td></tr>
                <tr><th>Data Source</th><td>Wikipedia & Spaceflight Archives</td></tr>
              </table>
            </aside>

            ${leadParagraphs.map(p => `<p>${p}</p>`).join("")}

            ${sections.filter(s => s.level === 2).length > 0 ? `
              <div class="toc">
                <div class="toc-title">Article Contents</div>
                <ul>
                  ${sections.filter(s => s.level === 2).map((sec, idx) => `
                    <li>${idx + 1}. <a href="#sec-${idx}">${sec.title}</a></li>
                  `).join("")}
                </ul>
              </div>
            ` : ""}

            ${(() => {
              let h2Count = -1;
              return sections.map(sec => {
                if (sec.level === 2) {
                  h2Count++;
                  return `<h2 id="sec-${h2Count}">${sec.title}</h2>` + sec.body.map(p => `<p>${p}</p>`).join("");
                } else {
                  return `<h3>${sec.title}</h3>` + sec.body.map(p => `<p>${p}</p>`).join("");
                }
              }).join("");
            })()}
          </article>
        `;
      } catch (err) {
        app.innerHTML = `<div class="article"><button onclick="loadCategory(currentCategory)">← Back</button><p>Error loading spacecraft dossier.</p></div>`;
      }
    }

    // Search Handlers
    document.getElementById("searchBtn").addEventListener("click", () => {
      const q = searchInput.value.trim();
      if (q) loadCategory(q, true);
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && searchInput.value.trim()) {
        loadCategory(searchInput.value.trim(), true);
      }
    });

    // Initial Load
    loadCategory(CATEGORIES[0]);
  </script>
</body>
</html>
